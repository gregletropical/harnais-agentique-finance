[project]
name = "gouvernance-second-cerveau"
version = "0.1.0"
description = "Lint, garde-fou de commit et hooks pour un second cerveau Obsidian écrit par plusieurs agents IA."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["controles", "controles/hooks"]
